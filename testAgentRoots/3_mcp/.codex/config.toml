# Локальные настройки варианта; модель и авторизация наследуются.
approval_policy = "never"
service_tier = "default"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[mcp_servers.jira]
enabled = true

# Разрешённые операции workflow без интерактивного подтверждения.
[mcp_servers.jira.tools.jira-jira_transition_issue]
approval_mode = "approve"

[mcp_servers.jira.tools.jira-jira_update_issue]
approval_mode = "approve"
